<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de correo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-xl mx-auto bg-white p-8 mt-10 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">¡Bienvenido a Mi Tension App!</h1>
        <p class="text-gray-700 mb-6">Hola <span class="font-semibold">{{NOMBRE}}</span>,</p>
        <p class="text-gray-700 mb-6">
            Gracias por registrarte en nuestra aplicación. Para activar tu cuenta, introduce el siguiente código de verificación en la aplicación:
        </p>
        <div class="text-center my-8">
            <span class="inline-block bg-blue-100 text-blue-800 font-mono text-4xl font-bold py-4 px-8 rounded-lg tracking-widest border-2 border-blue-200">
                {{CODIGO}}
            </span>
        </div>
        <p class="text-gray-500 text-sm mt-6">
            Este código expirará en 15 minutos. Si no te registraste, ignora este correo.
        </p>
    </div>
</body>
</html>
